# db-app: needs PostgreSQL. Used for the "db-down" and "missing-secret" scenarios.
apiVersion: v1
kind: Secret
metadata:
  name: db-creds          # deleting this Secret = the "missing-secret" scenario
  namespace: lab
  labels: { app: db-app, part-of: docksentinel-lab }
type: Opaque
stringData:
  DATABASE_URL: postgres://lab:labpass@postgres:5432/labdb
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-app
  namespace: lab
  labels: { app: db-app, part-of: docksentinel-lab }
spec:
  replicas: 1
  selector:
    matchLabels: { app: db-app }
  template:
    metadata:
      labels:
        app: db-app
        part-of: docksentinel-lab
        docksentinel.io/enabled: "true"   # opt in to DockSentinel monitoring
    spec:
      containers:
        - name: app
          image: lab/db-app:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: db-creds, key: DATABASE_URL }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 250m, memory: 128Mi }
          # Ready = the last DB check succeeded (/healthz returns 503 otherwise).
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
          # Alive = the process is listening. A TCP check (not /healthz) so a DB
          # outage shows up as the app's own exit, not as a liveness kill.
          livenessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: db-app
  namespace: lab
  labels: { app: db-app, part-of: docksentinel-lab }
spec:
  selector: { app: db-app }
  ports:
    - port: 8080
      targetPort: 8080
