[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "docker-sentinel"
version = "0.1.0"
description = "Lightweight local tool that detects and diagnoses failing Docker containers."
requires-python = ">=3.9"
dependencies = ["docker>=7.0"]

[project.scripts]
sentinel = "sentinel.cli:main"

[tool.setuptools]
packages = ["sentinel"]
