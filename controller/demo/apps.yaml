# DockSentinel demo apps. Each Deployment opts in with docksentinel.io/enabled: "true".
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
# 1) memory-app: needs ~90 MB but its limit is only 64Mi -> OOMKilled.
#    DockSentinel should raise the limit to 128Mi and verify it stays healthy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-app
  namespace: demo
  labels: {app: memory-app, docksentinel.io/enabled: "true"}
spec:
  replicas: 1
  selector: {matchLabels: {app: memory-app}}
  template:
    metadata: {labels: {app: memory-app}}
    spec:
      containers:
        - name: app
          image: python:3.12-alpine
          # Allocates MB megabytes of real memory and holds it.
          command: ["python", "-c"]
          args:
            - "import os,time; mb=int(os.environ['MB']); x=b'x'*(mb*1024*1024); print(f'holding {mb} MB', flush=True); time.sleep(10**9)"
          env: [{name: MB, value: "90"}]
          resources:
            requests: {memory: "32Mi", cpu: "50m"}
            limits: {memory: "128Mi", cpu: "250m"}
---
# 2) web: a healthy nginx with 2 replicas. Used for the bad-release scenarios.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: demo
  labels: {app: web, docksentinel.io/enabled: "true"}
  annotations: {kubernetes.io/change-cause: "v1 nginx 1.27"}
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          readinessProbe:
            httpGet: {path: /, port: 80}
            periodSeconds: 3
          resources:
            requests: {memory: "32Mi", cpu: "50m"}
            limits: {memory: "128Mi", cpu: "250m"}
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: demo}
spec:
  selector: {app: web}
  ports: [{port: 80, targetPort: 80}]
---
# 3) api: reads a password from Secret "api-secret".
#    The Secret is created by `demo.sh setup` and deleted by `demo.sh break missing-secret`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: demo
  labels: {app: api, docksentinel.io/enabled: "true"}
spec:
  replicas: 1
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      containers:
        - name: api
          image: nginx:1.27-alpine
          env:
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: api-secret, key: password}}
          resources:
            requests: {memory: "32Mi", cpu: "50m"}
            limits: {memory: "128Mi", cpu: "250m"}
